tool_descriptions:
  lookup_order: 根据客户提供的订单号查询订单。
  check_refund_policy: 找到订单后检查退款资格。
  request_approval: 为符合条件的退款申请主管审批。
  issue_refund: 仅在订单核实并获得批准后执行模拟退款。
  ask_order_id: 询问订单号；场景会提供预设的客户回复。
  escalate: 无法解决时将问题转交人工客服。
  send_response: 发送带有可验证语义代码的最终回复。
  close_case: 关闭问题；过早关闭会结束回合且判定失败。

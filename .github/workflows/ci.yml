name: continuous-integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Smoke-test installed evaluation CLI
        run: polyglot-run-eval --help
      - name: Run tests
        run: python -m pytest -q
      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          excluded = {".git", ".venv", "venv", "node_modules"}
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or excluded.intersection(path.parts):
                  continue
              try:
                  if path.suffix.lower() == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
                  elif path.suffix.lower() in {".yaml", ".yml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("Invalid data files:\n" + "\n".join(failures))
          print("All repository JSON and YAML files are valid.")
          PY
      - name: Validate benchmark task contracts
        run: python -m scripts.validate_benchmarks
      - name: Validate locale pack contracts
        run: python -m scripts.validate_locales
      - name: Validate bundled example records
        run: python -m scripts.validate_records --input examples/multilingual.jsonl
      - name: Run deterministic baseline regression
        run: |
          python evaluation/run_benchmark.py \
            --benchmark evaluation/benchmarks/ar_tasks_v0.2.json \
            --split development \
            --output /tmp/polyglot-baseline-report.json
          python -m evaluation.check_regression \
            --report /tmp/polyglot-baseline-report.json
      - name: Run English and French development regressions
        run: |
          set -euo pipefail
          for locale in en fr; do
            python evaluation/run_benchmark.py \
              --benchmark evaluation/benchmarks/${locale}_tasks.json \
              --split development \
              --locale "${locale}" \
              --output "/tmp/polyglot-${locale}-development-report.json"
            python -m evaluation.check_regression \
              --report "/tmp/polyglot-${locale}-development-report.json"
          done
      - name: Run Spanish locale parity regression on shared synthetic tasks
        run: |
          python evaluation/run_benchmark.py \
            --benchmark evaluation/benchmarks/ar_tasks_v0.2.json \
            --split development \
            --locale es \
            --output /tmp/polyglot-es-locale-parity-report.json
          python -m evaluation.check_regression \
            --report /tmp/polyglot-es-locale-parity-report.json
      - name: Run Chinese locale parity regression on shared synthetic tasks
        run: |
          python evaluation/run_benchmark.py \
            --benchmark evaluation/benchmarks/ar_tasks_v0.2.json \
            --split development \
            --locale zh-Hans \
            --output /tmp/polyglot-zh-locale-parity-report.json
          python -m evaluation.check_regression \
            --report /tmp/polyglot-zh-locale-parity-report.json
      - name: Run Japanese and Russian locale parity regressions on shared synthetic tasks
        run: |
          set -euo pipefail
          for locale in ja ru; do
            python evaluation/run_benchmark.py \
              --benchmark evaluation/benchmarks/ar_tasks_v0.2.json \
              --split development \
              --locale "${locale}" \
              --output "/tmp/polyglot-${locale}-locale-parity-report.json"
            python -m evaluation.check_regression \
              --report "/tmp/polyglot-${locale}-locale-parity-report.json"
          done
      - name: Check Python bytecode compilation
        run: python -m compileall -q environments evaluation scripts pipelines tests

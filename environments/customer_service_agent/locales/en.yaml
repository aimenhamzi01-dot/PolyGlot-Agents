tool_descriptions:
  lookup_order: Look up an order using the order number provided by the customer.
  check_refund_policy: Check refund eligibility after finding the order.
  request_approval: Request supervisor approval for an eligible refund.
  issue_refund: Issue a simulated refund only after verification and approval.
  ask_order_id: Ask for the order number; the scenario supplies a scripted customer reply.
  escalate: Hand the case to a human agent; safe for unresolved cases.
  send_response: Send a final response with a semantic code for verification.
  close_case: Close the case; early closure is unsuccessful and ends the episode.

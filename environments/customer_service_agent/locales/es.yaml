tool_descriptions:
  lookup_order: Buscar un pedido usando el número proporcionado por el cliente.
  check_refund_policy: Comprobar si el pedido puede recibir un reembolso después de encontrarlo.
  request_approval: Solicitar la aprobación de un supervisor para un reembolso elegible.
  issue_refund: Emitir un reembolso simulado solo después de verificar el pedido y obtener aprobación.
  ask_order_id: Pedir el número del pedido; el escenario proporciona una respuesta del cliente.
  escalate: Transferir el caso a un agente humano cuando no pueda resolverse.
  send_response: Enviar una respuesta final con un código semántico verificable.
  close_case: Cerrar el caso; el cierre prematuro termina el episodio sin éxito.

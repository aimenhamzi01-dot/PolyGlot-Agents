[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-agents"
version = "0.1.0"
description = "Open, multilingual data and verifiable environments for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "Gymnasium>=0.29,<2.0",
  "PyYAML>=6.0",
  "langcodes[data]>=3.5,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "fastapi>=0.110,<1.0", "httpx>=0.27,<1.0"]
api = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.29,<1.0", "httpx>=0.27,<1.0"]
pipeline = [
  "fasttext-wheel>=0.9.2",
  "numpy>=1.23,<2.0",
  "pandas>=2.0,<3.0",
  "pyarrow>=14.0,<20.0",
  "datasets>=3.0,<4.0",
]
training = [
  "torch>=2.2",
  "transformers>=4.40,<5.0",
  "accelerate>=0.28",
  "peft>=0.10",
  "safetensors>=0.4",
]

[project.scripts]
polyglot-validate-benchmarks = "scripts.validate_benchmarks:main"
polyglot-validate-locales = "scripts.validate_locales:main"
polyglot-validate-records = "scripts.validate_records:main"
polyglot-render-report = "evaluation.report:main"
polyglot-check-regression = "evaluation.check_regression:main"
polyglot-run-eval = "evaluation.run_benchmark:main"
polyglot-review-queue = "scripts.review_queue:main"
polyglot-rights-lifecycle = "scripts.rights_lifecycle:main"
polyglot-release-manifest = "evaluation.release_manifest:main"
polyglot-coverage-dashboard = "evaluation.coverage_dashboard:main"
polyglot-scaffold-language = "scripts.scaffold_language:main"

[tool.setuptools.packages.find]
include = ["environments*", "evaluation*", "scripts*", "pipelines*", "serving*"]

[tool.setuptools.package-data]
"environments.customer_service_agent" = ["locales/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

tool_descriptions:
  lookup_order: Найти заказ по номеру, указанному клиентом.
  check_refund_policy: Проверить право на возврат после поиска заказа.
  request_approval: Запросить одобрение руководителя для подходящего возврата.
  issue_refund: Выполнить имитацию возврата только после проверки заказа и получения одобрения.
  ask_order_id: Запросить номер заказа; сценарий содержит подготовленный ответ клиента.
  escalate: Передать обращение специалисту, если его нельзя решить самостоятельно.
  send_response: Отправить итоговый ответ с проверяемым семантическим кодом.
  close_case: Закрыть обращение; преждевременное закрытие завершает эпизод без успеха.

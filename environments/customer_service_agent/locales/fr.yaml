tool_descriptions:
  lookup_order: Rechercher une commande avec le numéro fourni par le client.
  check_refund_policy: Vérifier l'éligibilité au remboursement après avoir trouvé la commande.
  request_approval: Demander l'approbation d'un superviseur pour un remboursement éligible.
  issue_refund: Effectuer un remboursement simulé après vérification et approbation.
  ask_order_id: Demander le numéro de commande; le scénario fournit la réponse du client.
  escalate: Transférer le dossier à un agent humain pour les cas non résolus.
  send_response: Envoyer une réponse finale avec un code sémantique vérifiable.
  close_case: Fermer le dossier; une fermeture prématurée échoue et termine l'épisode.

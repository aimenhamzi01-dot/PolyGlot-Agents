name: continuous-integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          excluded = {".git", ".venv", "venv", "node_modules"}
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or excluded.intersection(path.parts):
                  continue
              try:
                  if path.suffix.lower() == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
                  elif path.suffix.lower() in {".yaml", ".yml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("Invalid data files:\n" + "\n".join(failures))
          print("All repository JSON and YAML files are valid.")
          PY
      - name: Validate benchmark task contracts
        run: python -m scripts.validate_benchmarks
      - name: Check Python bytecode compilation
        run: python -m compileall -q environments evaluation scripts pipelines tests
